services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app-net]

  postgres-onec:
    image: postgres:16
    environment:
      POSTGRES_DB: onec
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_onec_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d onec"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app-net]

  postgres-gos:
    image: postgres:16
    environment:
      POSTGRES_DB: gos
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_gos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d gos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app-net]

  redis:
    image: redis:7
    command: >
      sh -c "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-server --requirepass \"$${REDIS_PASSWORD}\"; else redis-server; fi"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app-net]

  onec:
    build:
      context: ./1C/1C
      dockerfile: Dockerfile
    environment:
      DATA_DIR: /data
      POSTGRES_HOST: postgres-onec
      POSTGRES_PORT: 5432
      POSTGRES_DB: onec
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKEND_URL: http://app:8080
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:?Set INTEGRATION_API_KEY in .env}
      SEED_COMPANY_CODES: ${SEED_COMPANY_CODES:-C001,C002,C003}
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres-onec:
        condition: service_healthy
    networks: [app-net]

  gos-service:
    build:
      context: ./Gos_service
      dockerfile: Dockerfile
    environment:
      DATA_DIR: /data
      POSTGRES_HOST: postgres-gos
      POSTGRES_PORT: 5432
      POSTGRES_DB: gos
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKEND_URL: http://app:8080
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:?Set INTEGRATION_API_KEY in .env}
      SEED_COMPANY_CODES: ${SEED_COMPANY_CODES:-C001,C002,C003}
    volumes:
      - ./data:/data:ro
    depends_on:
      postgres-gos:
        condition: service_healthy
    networks: [app-net]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ML_CORE_URL: ${ML_CORE_URL:-http://ml-core:8000}
      ML_CORE_ENABLED: ${ML_CORE_ENABLED:-true}
      FORECAST_SOURCE: ${FORECAST_SOURCE:-auto}
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-ml-core}
      ONEC_URL: http://onec:8081
      GOS_URL: http://gos-service:8082
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:?Set INTEGRATION_API_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      onec:
        condition: service_started
      gos-service:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [app-net]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "${HOST_BIND_ADDRESS:-192.168.31.206}:80:80"
    depends_on:
      app:
        condition: service_healthy
    networks: [app-net]

volumes:
  postgres_data:
  postgres_onec_data:
  postgres_gos_data:
  redis_data:

networks:
  app-net:
    external: true
    name: app-net
