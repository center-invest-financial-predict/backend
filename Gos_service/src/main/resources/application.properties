server.port=8082
spring.application.name=Gos_service

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5435}/${POSTGRES_DB:gos}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

data.dir=${DATA_DIR:../data}
data.seed-company-codes=${SEED_COMPANY_CODES:C001,C002,C003}
backend.url=${BACKEND_URL:http://localhost:8080}
backend.api-key=${INTEGRATION_API_KEY:dev-integration-key}
integration.source=Gos_service
integration.filter-mode=gos
