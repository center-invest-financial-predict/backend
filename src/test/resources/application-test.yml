spring:
  datasource:
    url: jdbc:h2:mem:demo-test;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # H2 maps TEXT columns to CLOB, which Hibernate's validate rejects; the schema comes from Liquibase anyway.
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
  liquibase:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      password:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

ml:
  core:
    # tests never call the real ML Core server
    enabled: false
    url: http://127.0.0.1:1

forecast:
  source: builtin

assistant:
  provider: local

app:
  assistant:
    timeout-seconds: 3
  jwt:
    secret: testSecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLongForHS256
    expiration: 86400000
    refresh-expiration: 604800000
  admin:
    email: admin@example.com
    password: admin123
  integration:
    api-key: test-integration-key
  integrations:
    onec:
      url: http://localhost:18081
    gos:
      url: http://localhost:18082

logging:
  level:
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
