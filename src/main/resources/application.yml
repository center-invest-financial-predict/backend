spring:
  application:
    name: hackathon-app
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:hackathon}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  ai:
    openai:
      # The fallback assistant client talks to the llama.cpp service on app-net.
      base-url: ${LLM_BASE_URL:http://llm:8080/v1}
      api-key: ${LLM_API_KEY:ollama}
      chat:
        model: ${LLM_MODEL:unsloth/Qwen3.5-9B-GGUF:UD-Q5_K_XL}

ml:
  # "Cashflow ML Core" (FastAPI): /v1/forecasts, /v1/chat, /v1/imports/*, /health/*
  core:
    enabled: ${ML_CORE_ENABLED:true}
    url: ${ML_CORE_URL:http://192.168.31.206:18081}
    connect-timeout-ms: ${ML_CORE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ML_CORE_READ_TIMEOUT_MS:15000}
    slow-read-timeout-ms: ${ML_CORE_SLOW_READ_TIMEOUT_MS:90000}
    history-days: ${ML_CORE_HISTORY_DAYS:365}

forecast:
  # auto (default) | mlcore: ask the ML Core server for the baseline forecast and use it only if it is real
  #   (is_stub=false AND cash_gap_probability is calculated); otherwise the built-in engine answers and `source`/`sourceNote`
  #   in the API say why. builtin: never call the server for the forecast.
  source: ${FORECAST_SOURCE:auto}

assistant:
  # ml-core (default) | auto: ML Core /v1/chat first, then the local LLM (spring.ai.openai), then a deterministic summary.
  # local: only the local LLM.
  provider: ${ASSISTANT_PROVIDER:ml-core}

app:
  jwt:
    secret: ${JWT_SECRET:mySecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLongForHS256Algorithm}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  admin:
    email: ${APP_ADMIN_EMAIL:admin@example.com}
    password: ${APP_ADMIN_PASSWORD:admin123}
  integration:
    api-key: ${INTEGRATION_API_KEY:dev-integration-key}
  integrations:
    onec:
      url: ${ONEC_URL:http://localhost:8081}
    gos:
      url: ${GOS_URL:http://localhost:8082}

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.example.demo.client: DEBUG
    com.example.demo.security: DEBUG
